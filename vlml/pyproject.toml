[project]
name = "vlml"
version = "0.1.0"
description = "Valorant MCP Server for Esports Analytics using GRID API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kenneth Adrian Ubales"}
]

dependencies = [
    "mcp>=1.1.2",
    "httpx>=0.27.0",
    "gql[httpx]>=3.5.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
vlml = "vlml.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
